services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: tripsplit-minio
    ports:
      - "9500:9000"   # S3 API (порт 9000 в диапазоне, зарезервированном Windows)
      - "9501:9001"   # Web-консоль (порт 9001 временно занят Windows/Docker Desktop)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: tripsplit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/tripsplit-receipts &&
      exit 0
      "

volumes:
  minio-data:
